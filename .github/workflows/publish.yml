name: Publish prototypes

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: publish-prototypes-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'pull_request' ||
       ((github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted publisher from main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install trusted publisher dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download untrusted build output
        uses: actions/download-artifact@v8
        with:
          name: prototype-artifacts
          path: packaged-artifacts
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Select release channel
        id: release
        env:
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "mode=preview" >> "$GITHUB_OUTPUT"
          else
            echo "mode=stable" >> "$GITHUB_OUTPUT"
          fi
          echo "branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Validate and publish allowlisted artifacts
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          PUBLISH_MODE: ${{ steps.release.outputs.mode }}
          PUBLISH_BRANCH: ${{ steps.release.outputs.branch }}
        run: >-
          node scripts/publish.mjs
          --artifacts packaged-artifacts
          --mode "$PUBLISH_MODE"
          --branch "$PUBLISH_BRANCH"

      - name: Comment preview URLs on pull request
        if: steps.release.outputs.mode == 'preview'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PREVIEW_BRANCH: ${{ steps.release.outputs.branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          node scripts/comment-preview.mjs
          --artifacts packaged-artifacts
          --branch "$PREVIEW_BRANCH"
          --pr "$PR_NUMBER"
          --head-sha "$HEAD_SHA"
