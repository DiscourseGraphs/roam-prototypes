name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test deployment contract
        run: pnpm test

      - name: Build prototypes
        run: pnpm build

      - name: Select changed prototypes
        id: changes
        if: github.event_name != 'workflow_dispatch'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if ! git cat-file -e "$BASE_SHA^{commit}" || ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "publish_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish_all=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-paths.txt
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-paths.txt
          fi

      - name: Prepare public artifacts
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.changes.outputs.publish_all }}" == "true" ]]; then
            pnpm prepare:artifacts
          else
            node scripts/prepare-artifacts.mjs --changed-paths changed-paths.txt
          fi

      - name: Upload public artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: prototype-artifacts
          path: packaged-artifacts
          if-no-files-found: error
          retention-days: 7
