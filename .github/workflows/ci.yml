name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test deployment contract
        run: pnpm test

      - name: Build prototypes
        run: pnpm build

      - name: Prepare public artifacts
        run: pnpm prepare:artifacts

      - name: Upload public artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: prototype-artifacts
          path: packaged-artifacts
          if-no-files-found: error
          retention-days: 7
